<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mahdi online - m.o.1.0</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        cardHover: '#334155',
                        accent: '#6366f1',
                        accentHover: '#4f46e5'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="bg-darkBg min-h-screen text-slate-100 flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 left-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- 1. Splash Screen -->
    <div id="splash-screen" class="fixed inset-0 bg-darkBg z-50 flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="relative flex flex-col items-center">
            <div class="w-20 h-20 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-2xl shadow-indigo-500/50 mb-6 animate-bounce">
                <i class="fa-solid fa-globe text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-wider text-white mb-2">mahdi online</h1>
            <span class="px-3 py-1 bg-slate-800 border border-slate-700 text-indigo-400 rounded-full text-xs font-semibold tracking-widest uppercase mb-8 shadow-inner">
                m.o.1.0
            </span>
            <div class="flex items-center gap-2 text-slate-400">
                <div class="w-5 h-5 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                <span class="text-sm font-medium">جاري تهيئة المنصة النظيفة...</span>
            </div>
        </div>
    </div>

    <!-- Main App Wrapper -->
    <div id="app-wrapper" class="flex-1 flex flex-col opacity-0 transition-opacity duration-500">

        <!-- Auth Section (Login / Sign Up) -->
        <div id="auth-container" class="flex-1 flex items-center justify-center p-4 hidden">
            <div class="w-full max-w-md bg-cardBg border border-slate-800 rounded-3xl p-8 shadow-2xl shadow-black/50">
                
                <!-- Logo & Heading -->
                <div class="text-center mb-8">
                    <div class="w-14 h-14 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-indigo-500/30 mb-4">
                        <i class="fa-solid fa-globe text-2xl text-white"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-white tracking-tight">mahdi online</h2>
                    <p class="text-xs text-indigo-400 font-medium mt-1">الإصدار الأساسي m.o.1.0</p>
                </div>

                <!-- Tabs Switcher -->
                <div class="flex bg-slate-900 p-1.5 rounded-2xl mb-6 border border-slate-800">
                    <button id="tab-login-btn" onclick="switchAuthTab('login')" class="flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all text-white bg-indigo-600 shadow-md">تسجيل الدخول</button>
                    <button id="tab-signup-btn" onclick="switchAuthTab('signup')" class="flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all text-slate-400 hover:text-white">حساب جديد</button>
                </div>

                <!-- Login Form -->
                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">اسم المستخدم</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-500">
                                <i class="fa-solid fa-user"></i>
                            </span>
                            <input type="text" id="login-username" required autocomplete="username" placeholder="أدخل اسم المستخدم"
                                class="w-full bg-slate-900 border border-slate-800 rounded-xl pr-10 pl-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">كلمة المرور</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-500">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••"
                                class="w-full bg-slate-900 border border-slate-800 rounded-xl pr-10 pl-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                        </div>
                    </div>
                    <button type="submit" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                        <span>دخول إلى المنصة</span>
                        <i class="fa-solid fa-arrow-left text-xs"></i>
                    </button>
                </form>

                <!-- Sign Up Form -->
                <form id="signup-form" onsubmit="handleSignup(event)" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">اختر اسم المستخدم</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-500">
                                <i class="fa-solid fa-user-plus"></i>
                            </span>
                            <input type="text" id="signup-username" required autocomplete="username" placeholder="مثال: mahdi_dev"
                                class="w-full bg-slate-900 border border-slate-800 rounded-xl pr-10 pl-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">كلمة المرور</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-500">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" id="signup-password" required autocomplete="new-password" placeholder="••••••••"
                                class="w-full bg-slate-900 border border-slate-800 rounded-xl pr-10 pl-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                        </div>
                    </div>
                    <button type="submit" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                        <span>إنشاء الحساب الان</span>
                        <i class="fa-solid fa-check text-xs"></i>
                    </button>
                </form>

            </div>
        </div>

        <!-- Main Feed Section -->
        <div id="feed-container" class="flex-1 flex flex-col hidden">
            
            <!-- Navbar Header -->
            <header class="bg-cardBg border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md bg-opacity-95">
                <div class="max-w-2xl mx-auto px-4 h-16 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-md shadow-indigo-500/30">
                            <i class="fa-solid fa-globe text-white"></i>
                        </div>
                        <div>
                            <h1 class="font-bold text-base text-white tracking-wide">mahdi online</h1>
                            <span class="text-[10px] bg-slate-800 text-indigo-400 px-2 py-0.5 rounded-md font-semibold">m.o.1.0</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl">
                            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                            <span id="current-username-display" class="text-xs font-bold text-slate-200"></span>
                        </div>
                        <button onclick="handleLogout()" title="تسجيل الخروج" class="w-10 h-10 bg-slate-900 border border-slate-800 hover:border-red-500/50 hover:bg-red-500/10 text-slate-400 hover:text-red-400 rounded-xl flex items-center justify-center transition-all">
                            <i class="fa-solid fa-power-off text-sm"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Main Content Area -->
            <main class="flex-1 max-w-2xl w-full mx-auto p-4 space-y-6">
                
                <!-- Post Creation Card -->
                <div class="bg-cardBg border border-slate-800 rounded-2xl p-4 shadow-xl">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-9 h-9 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold text-sm" id="publisher-avatar">
                            م
                        </div>
                        <span class="text-xs font-semibold text-slate-300">مشاركة أفكارك مع المجتمع</span>
                    </div>
                    <form onsubmit="handleCreatePost(event)">
                        <textarea id="post-content-input" rows="3" placeholder="ما الذي يدور في ذهنك اليوم؟..." required
                            class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all resize-none"></textarea>
                        
                        <div class="flex items-center justify-between mt-3 pt-3 border-t border-slate-800/60">
                            <div class="flex items-center gap-2 text-slate-500 text-xs">
                                <i class="fa-solid fa-earth-americas"></i>
                                <span>منشور عام (نظيف)</span>
                            </div>
                            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs px-5 py-2.5 rounded-xl transition-all shadow-md shadow-indigo-600/20 flex items-center gap-2">
                                <i class="fa-solid fa-paper-plane"></i>
                                <span>نشر المنشور</span>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Feed Stream -->
                <div class="space-y-4">
                    <div class="flex items-center justify-between px-1">
                        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                            <i class="fa-solid fa-stream text-indigo-400"></i>
                            <span>الخلاصة الحية (المنشورات)</span>
                        </h2>
                        <span id="posts-count-badge" class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-md font-semibold">0 منشور</span>
                    </div>

                    <!-- Posts Wrapper -->
                    <div id="posts-stream" class="space-y-4">
                        <!-- Dynamically populated or empty state inserted here -->
                    </div>
                </div>

            </main>
        </div>

    </div>

    <!-- Application JavaScript Logic -->
    <script>
        // Storage Key Constants
        const DB_KEY = 'mahdi_online_core_db';

        // Core Database Schema Initialization (Clean, No Dummy Data)
        function getDB() {
            let data = localStorage.getItem(DB_KEY);
            if (!data) {
                const initialDB = {
                    users: [],       // Array of { username, password }
                    posts: [],       // Array of { id, username, content, timestamp }
                    session: null    // Current logged in username string or null
                };
                localStorage.setItem(DB_KEY, JSON.stringify(initialDB));
                return initialDB;
            }
            try {
                return JSON.parse(data);
            } catch (e) {
                const fallbackDB = { users: [], posts: [], session: null };
                localStorage.setItem(DB_KEY, JSON.stringify(fallbackDB));
                return fallbackDB;
            }
        }

        function saveDB(db) {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        // Custom Toast Notification System (Replaces alert)
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgClass = type === 'success' ? 'bg-emerald-600/90 border-emerald-500' : 'bg-rose-600/90 border-rose-500';
            const iconClass = type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation';

            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl text-white text-xs font-medium border backdrop-blur-md ${bgClass} transition-all duration-300 translate-y-2 opacity-0`;
            toast.innerHTML = `
                <i class="fa-solid ${iconClass} text-base"></i>
                <span>${message}</span>
            `;

            container.appendChild(toast);

            // Animate in
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Switch between Login and Sign Up Tabs
        function switchAuthTab(tab) {
            const loginBtn = document.getElementById('tab-login-btn');
            const signupBtn = document.getElementById('tab-signup-btn');
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');

            if (tab === 'login') {
                loginBtn.className = 'flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all text-white bg-indigo-600 shadow-md';
                signupBtn.className = 'flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all text-slate-400 hover:text-white';
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
            } else {
                signupBtn.className = 'flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all text-white bg-indigo-600 shadow-md';
                loginBtn.className = 'flex-1 py-2.5 text-sm font-semibold rounded-xl transition-all text-slate-400 hover:text-white';
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }

        // Handle Signup Submission
        function handleSignup(e) {
            e.preventDefault();
            const username = document.getElementById('signup-username').value.trim();
            const password = document.getElementById('signup-password').value.trim();

            if (!username || !password) {
                showToast('الرجاء إدخال اسم المستخدم وكلمة المرور', 'error');
                return;
            }

            if (username.length < 3) {
                showToast('اسم المستخدم يجب أن يكون 3 أحرف على الأقل', 'error');
                return;
            }

            const db = getDB();
            const userExists = db.users.some(u => u.username.toLowerCase() === username.toLowerCase());

            if (userExists) {
                showToast('اسم المستخدم هذا مستخدم مسبقاً، اختر اسمًا آخر', 'error');
                return;
            }

            // Register new user & establish session
            db.users.push({ username, password });
            db.session = username;
            saveDB(db);

            showToast(`أهلاً بك ${username}! تم إنشاء حسابك بنجاح.`);
            document.getElementById('signup-form').reset();
            checkAuthState();
        }

        // Handle Login Submission
        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();

            const db = getDB();
            const user = db.users.find(u => u.username.toLowerCase() === username.toLowerCase() && u.password === password);

            if (!user) {
                showToast('اسم المستخدم أو كلمة المرور غير صحيحة', 'error');
                return;
            }

            db.session = user.username;
            saveDB(db);

            showToast(`مرحباً عودتك، ${user.username}!`);
            document.getElementById('login-form').reset();
            checkAuthState();
        }

        // Handle Logout
        function handleLogout() {
            const db = getDB();
            db.session = null;
            saveDB(db);
            showToast('تم تسجيل الخروج بنجاح');
            checkAuthState();
        }

        // Handle Post Creation
        function handleCreatePost(e) {
            e.preventDefault();
            const contentInput = document.getElementById('post-content-input');
            const content = contentInput.value.trim();

            if (!content) return;

            const db = getDB();
            if (!db.session) {
                showToast('يرجى تسجيل الدخول أولاً لنشر المنشورات', 'error');
                checkAuthState();
                return;
            }

            const newPost = {
                id: 'post_' + Date.now() + Math.random().toString(36.2),
                username: db.session,
                content: content,
                timestamp: Date.now()
            };

            db.posts.unshift(newPost); // Newest first
            saveDB(db);

            contentInput.value = '';
            showToast('تم نشر المنشور بنجاح');
            renderFeed();
        }

        // Format relative or exact date nicely in Arabic
        function formatTime(timestamp) {
            const now = Date.now();
            const diffMs = now - timestamp;
            const diffSec = Math.floor(diffMs / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHour = Math.floor(diffMin / 60);
            const diffDay = Math.floor(diffHour / 24);

            if (diffSec < 60) return 'الآن عفوياً';
            if (diffMin < 60) return `منذ ${diffMin} دقيقة`;
            if (diffHour < 24) return `منذ ${diffHour} ساعة`;
            if (diffDay < 7) return `منذ ${diffDay} يوم`;
            
            const date = new Date(timestamp);
            return date.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        // Render Feed Posts Stream
        function renderFeed() {
            const db = getDB();
            const streamContainer = document.getElementById('posts-stream');
            const countBadge = document.getElementById('posts-count-badge');

            countBadge.textContent = `${db.posts.length} منشور`;

            if (db.posts.length === 0) {
                streamContainer.innerHTML = `
                    <div class="bg-cardBg border border-slate-800 rounded-2xl p-10 text-center space-y-3">
                        <div class="w-14 h-14 bg-slate-900 border border-slate-800 rounded-full flex items-center justify-center mx-auto text-slate-500 text-xl">
                            <i class="fa-solid fa-inbox"></i>
                        </div>
                        <h3 class="font-bold text-sm text-slate-300">الخلاصة نظيفة تماماً</h3>
                        <p class="text-xs text-slate-500 max-w-xs mx-auto">لا توجد منشورات حالياً. كن أول من يكتب وينشر فكرة أو منشوراً في منصة mahdi online!</p>
                    </div>
                `;
                return;
            }

            let html = '';
            db.posts.forEach(post => {
                const firstLetter = post.username.charAt(0).toUpperCase();
                html += `
                    <div class="bg-cardBg border border-slate-800 rounded-2xl p-5 shadow-lg space-y-3 transition-all hover:border-slate-700">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-white font-bold text-sm shadow-md shadow-indigo-500/20">
                                    ${firstLetter}
                                </div>
                                <div>
                                    <h3 class="font-bold text-sm text-white">${escapeHtml(post.username)}</h3>
                                    <span class="text-[11px] text-slate-500 flex items-center gap-1 mt-0.5">
                                        <i class="fa-regular fa-clock"></i>
                                        <span>${formatTime(post.timestamp)}</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="text-sm text-slate-200 leading-relaxed whitespace-pre-wrap break-words pr-1">
                            ${escapeHtml(post.content)}
                        </div>
                    </div>
                `;
            });

            streamContainer.innerHTML = html;
        }

        // HTML Escape helper for security against XSS
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Check and toggle Auth vs Feed states
        function checkAuthState() {
            const db = getDB();
            const authContainer = document.getElementById('auth-container');
            const feedContainer = document.getElementById('feed-container');

            if (db.session) {
                // User is logged in
                authContainer.classList.add('hidden');
                feedContainer.classList.remove('hidden');
                
                // Update header username and publisher avatar
                document.getElementById('current-username-display').textContent = db.session;
                document.getElementById('publisher-avatar').textContent = db.session.charAt(0).toUpperCase();

                renderFeed();
            } else {
                // User is logged out
                feedContainer.classList.add('hidden');
                authContainer.classList.remove('hidden');
            }
        }

        // Initialize application flow with Splash Screen
        window.addEventListener('load', () => {
            // Ensure DB exists and initialized clean
            getDB();

            // Simulate splash screen duration then fade in app
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const wrapper = document.getElementById('app-wrapper');

                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    wrapper.classList.remove('opacity-0');
                    checkAuthState();
                }, 700);
            }, 1200);
        });
    </script>
</body>
</html>
